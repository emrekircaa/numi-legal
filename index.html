<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kambio</title>
<style>
  :root { color-scheme: dark light; --bg:#0B1210; --fg:#E8F1ED; --muted:#9AAFA7; --accent:#2ECC8F; --line:#1E2C27; }
  @media (prefers-color-scheme: light) { :root { --bg:#FFFFFF; --fg:#12201B; --muted:#5A6B65; --line:#E2EAE7; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  main { max-width:520px; padding:48px 24px; }
  h1 { font-size:2rem; margin:0 0 4px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 32px; }
  a { color:var(--accent); display:block; padding:14px 18px; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; text-decoration:none; }
  a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Kambio</h1>
  <p>Scan a price, see it in your own money. · Fiyatı tara, kendi paranla gör.</p>
  <a href="support.html">Support · Destek</a>
  <a href="privacy.html">Privacy Policy · Gizlilik Politikası</a>
</main>
</body>
</html>
